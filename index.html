html{

}

.card{
  background:var(--surface);

  border-radius:18px
}

.card-soft{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:14px
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border-radius:999px;
  padding:5px 10px;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  font-weight:800
}

.badge-gold{
  background:rgba(255,197,61,.14);
  color:var(--gold);
  border:1px solid rgba(255,197,61,.35)
}

.badge-teal{
  background:rgba(45,212,191,.12);
  color:var(--teal);
  border:1px solid rgba(45,212,191,.32)
}

.badge-coral{
  background:rgba(255,107,74,.12);
  color:var(--coral);
  border:1px solid rgba(255,107,74,.35)
}

.badge-blue{
  background:rgba(85,167,255,.12);
  color:var(--blue);
  border:1px solid rgba(85,167,255,.35)
}

.nav-item{
  width:100%;
  text-align:left;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 11px;
  border-radius:11px;
  border:1px solid transparent;
  color:var(--muted);
  background:transparent;
  cursor:pointer;
  font-size:14px;
  font-weight:600
}

.nav-item:hover{
  background:var(--surface-2);
  color:var(--text)
}

.nav-item.active{
  background:var(--gold);
  color:#181204;
  border-color:var(--gold)
}

.nav-item.active .nav-sub{
  color:#3d2f05
}

.nav-sub{
  font-size:11px;
  color:var(--muted-2);
  font-weight:500
}

.search-input{
  width:100%;
  background:#0c1219;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:12px;
  padding:11px 12px 11px 38px;
  outline:none
}

.search-input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(255,197,61,.16)

.prose p{
  color:#cbd7e3;
  line-height:1.75;
  font-size:15px
}

.prose li{

  line-height:1.65

tendimento.","Em caso de dúvida, use o canal de suporte da cidade."]},{heading:"O espírito da cidade",paragraphs:["Araruama valoriza história, consequência e convivência. Um personagem tem nome, rotina, trabalho, vínculos e limites. As escolhas dentro do jogo geram efeitos: reputação, amizades, dívidas, oportunidades e conflitos que precisam ser interpretados até o fim."],bullets:["Interprete sempre como seu personagem.","Valorize a vida do seu personagem.","Respeite a história dos outros personagens.","Separe o que é jogo do que é fora do jogo."]},{heading:"Mapa mental da cidade",paragraphs:["A cidade mistura centro comercial, bairros residenciais, orla, áreas de serviço e pontos de encontro. Hospital, batalhões, Detran, fórum, Receita Federal e mecânicas funcionam como referências fixas para quem vive, trabalha e circula por Araruama."],callout:"Regra de ouro: se uma ação prejudica a experiência de outra pessoa sem motivo dentro da história, ela não pertence a Araruama."}]},{id:"como-jogar",group:"Comece aqui",title:"Como jogar",short:"Primeiros passos, personagem e rotina",badge:"Primeiros passos",badgeClass:"badge-teal",intro:"Entrar em Araruama é criar um personagem com identidade própria e começar a viver a cidade. Este guia organiza os primeiros passos sem atalhos: crie, chegue, aprenda a rotina e encontre seu lugar.",sections:[{heading:"1. Crie seu personagem",paragraphs:["Escolha nome, sobrenome, aparência e uma história simples e coerente. O personagem precisa fazer sentido no Rio de Janeiro: onde mora, o que faz, como se sustenta e quais são seus vínculos. Evite nomes de pessoas reais, nomes de celebridades e histórias com poderes, cargos ou riquezas sem construção dentro do jogo."],bullets:["Nome completo coerente com a cidade.","Idade compatível com a história.","Origem, trabalho e rotina definidos.","Objetivos de curto e longo prazo."]},{heading:"2. Chegue à cidade",paragraphs:["Ao chegar, explore com calma. Conheça o centro, a orla e os serviços. Fale com outros personagens, visite comércios, observe como a cidade funciona e descubra oportunidades de trabalho. A pressa para entrar em conflito costuma gerar histórias curtas e sem profundidade."]},{heading:"3. Construa rotina",paragraphs:["Rotina é o que sustenta o roleplay: trabalhar, comer, abastecer, conversar, cuidar do veículo, pagar contas e resolver problemas. Um personagem com rotina é mais fácil de encontrar, de interpretar e de incluir em histórias coletivas."],bullets:["Tenha um trabalho ou fonte de renda.","Frequente lugares e pessoas com regularidade.","Registre compromissos e dívidas do personagem.","Deixe a história evoluir com o tempo."]},{heading:"O que fazer no primeiro dia",paragraphs:["Conheça um serviço público, visite um comércio, converse com dois ou três personagens e entenda como funciona o seu trabalho. Se você chegou com amigos, cada um deve manter a própria história: amizade de personagem se constrói dentro do jogo."],callout:"Seu personagem não conhece lugares, pessoas ou acontecimentos que você só viu fora do jogo."}]},{id:"regras-gerais",group:"Regras",title:"Regras Gerais",short:"Convivência, bom senso e limites da cidade",badge:"Leitura obrigatória",badgeClass:"badge-coral",intro:"As Regras Gerais valem para todos, em qualquer lugar da cidade, em qualquer horário. Elas existem para proteger a interpretação, a convivência e a continuidade das histórias.",sections:[{heading:"Convivência e respeito",paragraphs:["Trate todos com respeito dentro e fora do personagem. Ofensas fora do personagem, perseguição, assédio, discriminação e exposição de dados pessoais são proibidas. Conflito de personagem não autoriza desrespeito de jogador."],bullets:["Não leve conflito do jogo para fora do jogo.","Não exponha informações pessoais de ninguém.","Não use o jogo para constranger ou humilhar.","Resolva divergências com calma e pelos canais oficiais."]},{heading:"Interpretação acima de vantagem",paragraphs:["Araruama é roleplay, não disputa por vantagem. Não vale quebrar a interpretação para vencer, fugir, lucrar ou humilhar. O personagem deve agir como agiria na vida real, considerando medo, risco, cansaço, dor e consequência."],bullets:["Valorize a vida do personagem em qualquer situação.","Aceite perder quando a história levar a isso.","Não force uma cena para obter vantagem mecânica.","Não interrompa cenas alheias sem motivo dentro da história."]},{heading:"Justiça e consequência",paragraphs:["Toda ação tem consequência. Crimes, dívidas, conflitos e desrespeito a autoridades geram efeitos dentro da cidade. Não tente apagar a história com desculpas fora do personagem, troca de personagem para fugir de consequência ou abandono de cena."],callout:"Desconhecer a regra não anula a consequência dentro do jogo."}]},{id:"terminologia",group:"Regras",title:"Terminologia do Roleplay",short:"RDM, VDM, PG, MG e os termos usados na cidade",badge:"Glossário",badgeClass:"badge-blue",intro:"Este glossário explica os termos mais usados em Araruama. Conhecer o vocabulário evita erros, melhora a comunicação e deixa as cenas mais claras para todos.",sections:[{heading:"Termos essenciais",paragraphs:["Os termos abaixo aparecem em denúncias, atendimentos e conversas sobre regras. Leia com atenção: muitos deles descrevem comportamentos proibidos."],bullets:["RDM — matar ou ferir outro personagem sem motivo dentro da história.","VDM — usar veículo como arma sem motivo dentro da história.","Powergaming / PG — agir além do que seria possível ou plausível para o personagem.","Metagaming / MG — usar informação de fora do jogo dentro do jogo.","Combat Logging — sair do jogo ou desconectar para fugir de cena, prisão, morte ou prejuízo.","Fail RP — interpretar de forma incoerente com a realidade da cena.","Safezone — área onde não são permitidas ações hostis, conforme a página de cada local."]},{heading:"Termos de cena",paragraphs:["Cena é qualquer interação interpretada. Uma cena tem começo, desenvolvimento e desfecho. Respeitar a cena significa não cortar, não ignorar e não acelerar artificialmente o que está acontecendo."],bullets:["Cena em andamento deve ser concluída ou encerrada com acordo entre os envolvidos.","Narrativa de ferimento, prisão ou perda deve ser respeitada.","Informação obtida em cena pertence àquela cena, não a todos os personagens.","Não presuma o que outro personagem sabe, sente ou pretende."]},{heading:"Termos de comunicação",paragraphs:["Dentro do jogo, a comunicação deve ser do personagem. Informações de fora do jogo não podem virar conhecimento do personagem, mesmo quando parecem óbvias para quem está jogando."],callout:"Se você aprendeu fora do jogo, seu personagem ainda não sabe."}]},{id:"conduta",group:"Regras",title:"Conduta, Fair Play e Cenas",short:"Como agir em abordagem, confronto e atendimento",badge:"Fair play",badgeClass:"badge-teal",intro:"Boa conduta não é jogar devagar: é jogar com clareza, proporcionalidade e respeito pela cena. Esta página define o comportamento esperado em abordagens, confrontos, atendimentos e situações de tensão.",sections:[{heading:"Proporcionalidade",paragraphs:["A resposta do personagem deve ser proporcional à situação. Uma discussão não justifica agressão grave. Um furto não justifica perseguição sem limite. Um conflito pequeno não precisa virar guerra. A cidade fica melhor quando cada cena tem escala."],bullets:["Avalie risco, número de envolvidos e local antes de agir.","Dê chance de diálogo quando a cena permitir.","Não escale conflito apenas para provocar reação.","Interrompa a cena se ela sair do controle e peça ajuda da moderação."]},{heading:"Abordagens e rendição",paragraphs:["Em abordagem policial, assalto ou confronto, interprete medo, obediência, nervosismo e consequência. Rendição é uma decisão de personagem: quando o personagem se rende, a cena segue com respeito, sem humilhação e sem execução sem motivo."],bullets:["Siga comandos claros quando o personagem está em desvantagem.","Não invente fuga impossível no meio de uma rendição.","Não use animação, bug ou mecânica para quebrar a cena.","Preserve a vida do personagem mesmo em derrota."]},{heading:"Cenas sensíveis",paragraphs:["Cenas de violência, morte, hospital e perda exigem maturidade. Interprete com sobriedade, sem exagero, sem piada fora de hora e sem transformar dor alheia em entretenimento. Quem não se sente confortável pode pedir pausa e buscar a equipe de suporte."],callout:"A cena termina quando a história termina — não quando alguém desiste de interpretar."}]},{id:"hospital",group:"Safezones",title:"Hospital — Safezone",short:"Atendimento, emergência e respeito à área hospitalar",badge:"Safezone",badgeClass:"badge-teal",intro:"O Hospital é uma safezone da cidade de Araruama. É o espaço de atendimento, emergência, recuperação e trabalho dos profissionais de saúde. Dentro dele, a prioridade é cuidar de pessoas e manter o ambiente seguro.",sections:[{heading:"O que é o Hospital em Araruama",paragraphs:["O Hospital recebe emergências, atende feridos, acompanha pacientes e organiza o trabalho das equipes de saúde. É também um ponto de encontro de famílias, acompanhantes e profissionais que precisam de calma para trabalhar."],bullets:["Atendimento de emergência e triagem.","Recuperação após ferimentos e acidentes.","Trabalho contínuo das equipes de saúde.","Acolhimento de pacientes e acompanhantes."]},{heading:"Como usar a safezone",paragraphs:["Ao chegar ao Hospital, respeite a rotina do local. Anuncie-se como paciente ou acompanhante, aguarde atendimento, siga as orientações dos profissionais e evite qualquer ação que interrompa o trabalho da equipe."],bullets:["Não pratique ações hostis dentro da safezone.","Não persiga, ameace ou provoque dentro do Hospital.","Não interrompa atendimentos ou cirurgias.","Resolva conflitos fora da área hospitalar, depois do atendimento."]},{heading:"Para profissionais de saúde",paragraphs:["Profissionais de saúde atendem com prioridade para os casos mais graves. O atendimento segue a história do paciente: o que aconteceu, onde dói, há quanto tempo e quais são os riscos. Registro claro ajuda a continuidade do cuidado."],callout:"Hospital é lugar de cuidado. Quem precisa de ajuda deve se sentir seguro para pedir."}]},{id:"batalhoes",group:"Safezones",title:"Batalhões — Safezone",short:"Polícia, atendimento e segurança pública",badge:"Safezone",badgeClass:"badge-teal",intro:"Os Batalhões são safezones da cidade de Araruama. São as bases da segurança pública, onde a população registra ocorrências, busca atendimento e encontra as equipes responsáveis pela ordem na cidade.",sections:[{heading:"O que são os Batalhões",paragraphs:["Os Batalhões concentram policiamento, atendimento ao cidadão, registro de ocorrências e coordenação de operações. São referências de ordem e de serviço público em Araruama."],bullets:["Registro de ocorrências e denúncias.","Atendimento ao cidadão.","Base de viaturas e equipes.","Coordenação do policiamento da cidade."]},{heading:"Como usar a safezone",paragraphs:["Ao entrar em um Batalhão, apresente-se, explique o motivo da visita e aguarde orientação. O espaço deve ser usado para atendimento, denúncia, entrega de informações e apoio à segurança pública."],bullets:["Não pratique ações hostis dentro da safezone.","Não provoque, ameace ou confronte dentro do Batalhão.","Não interrompa atendimentos e operações internas.","Respeite filas, horários e orientações dos policiais."]},{heading:"Para quem busca atendimento",paragraphs:["Leve informações claras: o que aconteceu, onde, quando e quem estava envolvido. Quanto mais precisa for a informação, mais rápido o atendimento pode ser encaminhado."],callout:"Segurança pública começa com informação clara e respeito ao atendimento."}]},{id:"detran",group:"Safezones",title:"Detran — Safezone",short:"Documentos, veículos e atendimento ao condutor",badge:"Safezone",badgeClass:"badge-teal",intro:"O Detran é uma safezone da cidade de Araruama. É o órgão responsável pelo atendimento ligado a condutores e veículos, com foco em documentação, regularização e orientação ao cidadão.",sections:[{heading:"O que é o Detran",paragraphs:["O Detran organiza o atendimento de quem precisa regularizar documentos, consultar pendências ligadas ao veículo e entender as regras de circulação na cidade. É um serviço público de atendimento direto ao cidadão."],bullets:["Atendimento ao condutor.","Orientação sobre documentação de veículos.","Regularização e consulta de situação.","Atendimento organizado por ordem de chegada."]},{heading:"Como usar a safezone",paragraphs:["Chegue com os documentos do personagem, explique o que precisa e aguarde atendimento. O Detran é um espaço de serviço: mantenha o ambiente organizado e respeite o trabalho dos atendentes."],bullets:["Não pratique ações hostis dentro da safezone.","Não interrompa atendimentos.","Não pressione atendentes para acelerar processos.","Resolva desentendimentos fora da área de atendimento."]},{heading:"Dicas para o atendimento",paragraphs:["Antes de ir ao Detran, organize as informações do veículo e do personagem. Saber placa, modelo, situação e o que precisa resolver deixa o atendimento mais rápido para você e para quem está na fila."],callout:"Documento em dia evita dor de cabeça: regularize antes de circular."}]},{id:"juridico",group:"Safezones",title:"Jurídico — Safezone",short:"Fórum, audiências e acesso à justiça",badge:"Safezone",badgeClass:"badge-teal",intro:"O Jurídico é uma safezone da cidade de Araruama. É o espaço da justiça, das audiências, dos processos e do atendimento jurídico, onde conflitos são resolvidos com procedimento, registro e decisão.",sections:[{heading:"O que é o Jurídico",paragraphs:["O Jurídico concentra audiências, julgamentos, acordos e atendimentos ligados a processos. É onde a cidade resolve conflitos com regras claras, escuta das partes e decisão formal."],bullets:["Audiências e julgamentos.","Atendimento jurídico ao cidadão.","Registro de processos e decisões.","Mediação e acordo entre partes."]},{heading:"Como usar a safezone",paragraphs:["No Jurídico, fale com respeito, aguarde sua vez e siga a condução da audiência. Interrupções, ameaças e tentativas de intimidação não fazem parte do processo."],bullets:["Não pratique ações hostis dentro da safezone.","Não ameace partes, testemunhas ou autoridades.","Não interrompa audiências e julgamentos.","Apresente fatos com clareza e respeite a decisão."]},{heading:"Para quem vai a audiência",paragraphs:["Chegue no horário, leve documentos e informações do caso e esteja pronto para contar a versão do personagem com calma. A decisão considera o que foi apresentado e registrado no processo."],callout:"No Jurídico, quem fala com clareza e respeito fortalece a própria história."}]},{id:"receita",group:"Safezones",title:"Receita Federal — Safezone",short:"Atendimento fiscal e regularização",badge:"Safezone",badgeClass:"badge-teal",intro:"A Receita Federal é uma safezone da cidade de Araruama. É o espaço de atendimento fiscal, orientação tributária e regularização, onde cidadãos e empresas resolvem suas obrigações com a cidade.",sections:[{heading:"O que é a Receita Federal",paragraphs:["A Receita Federal atende cidadãos e empresas em temas fiscais, cadastros, declarações e regularização. É um serviço público que exige organização, documentos e atendimento formal."],bullets:["Atendimento fiscal ao cidadão.","Orientação sobre obrigações e declarações.","Regularização cadastral e fiscal.","Atendimento a empresas da cidade."]},{heading:"Como usar a safezone",paragraphs:["Ao procurar a Receita Federal, leve as informações do personagem ou da empresa e explique com clareza o que precisa regularizar. O atendimento segue ordem, registro e conferência de documentos."],bullets:["Não pratique ações hostis dentro da safezone.","Não pressione atendentes.","Não tente burlar atendimento ou registro.","Mantenha o ambiente formal e organizado."]},{heading:"Para empresas",paragraphs:["Empresas devem manter cadastro, movimentação e documentos organizados. A regularização evita bloqueios, multas e problemas em contratos, vendas e contratações dentro da cidade."],callout:"Empresa organizada é empresa que cresce: mantenha a parte fiscal em dia."}]},{id:"mecanica",group:"Safezones",title:"Mecânica — Safezone",short:"Reparo, revisão e cuidado com o veículo",badge:"Safezone",badgeClass:"badge-teal",intro:"A Mecânica é uma safezone da cidade de Araruama. É o espaço de reparo, revisão e manutenção de veículos, onde motoristas cuidam do carro e mecânicos executam o serviço com segurança.",sections:[{heading:"O que é a Mecânica",paragraphs:["A Mecânica atende veículos da cidade com reparo, revisão, troca de peças e manutenção preventiva. É também um ponto de encontro de motoristas e profissionais do setor automotivo."],bullets:["Reparo de veículos danificados.","Revisão e manutenção preventiva.","Troca de peças e ajustes.","Atendimento por ordem de chegada."]},{heading:"Como usar a safezone",paragraphs:["Ao chegar à Mecânica, explique o problema do veículo, aguarde o orçamento e a execução do serviço. A área de trabalho deve ficar livre para os mecânicos trabalharem com segurança."],bullets:["Não pratique ações hostis dentro da safezone.","Não interrompa o trabalho dos mecânicos.","Não circule pela área de serviço sem autorização.","Aguarde a liberação do veículo antes de sair."]},{heading:"Para motoristas",paragraphs:["Cuide do veículo como parte da rotina do personagem: revisão, abastecimento, reparo após acidente e respeito às regras de trânsito. Um veículo bem cuidado rende mais e evita problemas na rua."],callout:"Veículo revisado é rotina de quem vive da rua."}]},{id:"empregos",group:"Cidade",title:"Empregos e Profissões",short:"Trabalho, renda e progressão do personagem",badge:"Vida na cidade",badgeClass:"badge-gold",intro:"Trabalho é a base da vida em Araruama. Cada profissão tem rotina, responsabilidades e progressão. Escolha uma profissão que combine com a história do seu personagem e construa reputação com constância.",sections:[{heading:"Como escolher uma profissão",paragraphs:["Observe a cidade antes de decidir. Converse com quem já trabalha na área, entenda horários, riscos e ganhos e veja se a rotina combina com o seu personagem. Profissão não é só renda: é identidade, contatos e história."],bullets:["Serviços públicos: saúde, segurança e atendimento.","Comércio: lojas, oficinas, restaurantes e entregas.","Serviços urbanos: transporte, manutenção e obras.","Negócios próprios: gestão, atendimento e expansão."]},{heading:"Progressão",paragraphs:["Progressão vem de presença, qualidade do serviço e confiança. Quem cumpre horário, atende bem, registra o trabalho e respeita colegas cresce com mais facilidade. Mudanças de cargo e de função devem ser construídas dentro da história."],bullets:["Cumpra a escala e os compromissos.","Atenda com qualidade e respeito.","Registre serviços, vendas e atendimentos.","Construa reputação antes de pedir promoção."]},{heading:"Empreendedorismo",paragraphs:["Abrir um negócio exige planejamento, capital, local, equipe e regularização. Negócios que atendem bem, mantêm horário e cuidam da reputação tendem a se sustentar. Negócios que dependem de conflito permanente tendem a fechar."],callout:"Trabalho bem feito é a forma mais rápida de ser lembrado na cidade."}]},{id:"economia",group:"Cidade",title:"Economia, Veículos e Propriedades",short:"Dinheiro, compras, veículos e moradia",badge:"Sistemas",badgeClass:"badge-blue",intro:"A economia de Araruama funciona com renda, gastos, investimentos e escolhas. Veículos e propriedades são conquistas de personagem: exigem planejamento, manutenção e responsabilidade.",sections:[{heading:"Dinheiro e gastos",paragraphs:["O personagem gasta com moradia, alimentação, combustível, manutenção, documentos e lazer. Planejar gastos evita dívidas e mantém a rotina. Compras grandes devem fazer sentido com a renda e a história do personagem."],bullets:["Acompanhe entradas e saídas.","Evite dívidas sem plano de pagamento.","Negocie com clareza e registre acordos.","Não use dinheiro fora da história para justificar riqueza."]},{heading:"Veículos",paragraphs:["Veículos facilitam deslocamento e trabalho, mas exigem cuidado: combustível, revisão, reparo, documentos e respeito às regras de trânsito. Dirija como seu personagem dirigiria na vida real, com atenção ao local e ao risco."],bullets:["Mantenha documentos e revisão em dia.","Repare após acidentes e colisões.","Não use veículo para intimidar ou ferir sem motivo.","Estacione com respeito aos outros e às safezones."]},{heading:"Propriedades",paragraphs:["Moradia e comércio dão endereço, rotina e identidade ao personagem. Propriedades exigem pagamento, manutenção e convivência com vizinhos. Invadir, danificar ou ocupar propriedade alheia gera consequência dentro da cidade."],bullets:["Respeite a propriedade de outros personagens.","Mantenha o local organizado e em funcionamento.","Registre aluguéis, vendas e acordos.","Use a propriedade para fortalecer a história, não para fugir dela."]}]},{id:"comandos",group:"Cidade",title:"Comandos e Atalhos",short:"Referência rápida para o dia a dia",badge:"Referência",badgeClass:"badge-blue",intro:"Esta página reúne os comandos e atalhos mais usados na rotina de Araruama. Use como referência rápida durante o jogo, sem interromper a cena.",sections:[{heading:"Comunicação e interação",paragraphs:["A comunicação do personagem deve ser clara e contextual. Fale próximo de quem está na cena, use o tom adequado e evite mensagens fora do personagem no meio de uma interpretação."],bullets:["Fale com quem está perto da cena.","Use gestos e expressões para dar vida à cena.","Evite abreviações que quebram a interpretação.","Peça pausa com educação quando necessário."]},{heading:"Rotina e serviços",paragraphs:["Os comandos de rotina ajudam a trabalhar, atender, cobrar, registrar e se deslocar. Aprenda os comandos do seu trabalho antes de assumir plantão ou abrir o comércio."],bullets:["Conheça os comandos do seu emprego.","Confirme antes de cobrar ou transferir valores.","Registre atendimentos e vendas.","Confira o resultado antes de encerrar a cena."]},{heading:"Boas práticas",paragraphs:["Não use comandos para interromper cenas, fugir de abordagem ou obter vantagem. Se um comando falhar, informe a cena com calma e busque ajuda sem quebrar a interpretação."],callout:"Comando é ferramenta, não atalho para vencer a cena."}]},{id:"suporte",group:"Cidade",title:"Suporte, Denúncias e Recursos",short:"Como pedir ajuda e resolver conflitos",badge:"Ajuda",badgeClass:"badge-gold",intro:"Suporte existe para proteger a experiência de todos. Use os canais oficiais com informações claras, respeito e paciência. Denúncia não é vingança: é um pedido de análise de uma situação.",sections:[{heading:"Quando pedir suporte",paragraphs:["Peça suporte quando houver quebra de regra, bug que afeta a cena, conflito que saiu do controle ou situação que você não consegue resolver dentro do jogo. Quanto mais cedo o pedido, mais fácil é preservar a cena."],bullets:["Quebra de regra em andamento.","Bug que impede o jogo.","Conflito fora do personagem.","Dúvida sobre regra ou procedimento."]},{heading:"Como fazer uma denúncia",paragraphs:["Descreva o que aconteceu com fatos: data, horário, local, envolvidos e sequência dos acontecimentos. Evite julgamentos e ofensas. A equipe analisa com base em registros e relatos."],bullets:["Descreva fatos, não suposições.","Informe local, horário e envolvidos.","Anexe registros quando houver.","Aguarde a análise sem cobrar em outros canais."]},{heading:"Recursos e decisões",paragraphs:["Decisões da equipe devem ser respeitadas. Se houver recurso, apresente com calma, com fatos novos e dentro do prazo e do canal indicado. Discussão pública sobre punição não resolve o caso e prejudica a comunidade."],callout:"Peça ajuda cedo. Resolver depois costuma ser mais difícil para todos."}]}],wd=["Comece aqui","Regras","Safezones","Cidade"];fu
